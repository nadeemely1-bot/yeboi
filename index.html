<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Crew Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NEW: Double-buffered overlay crossfade background framework elements -->
    <div id="bg-master" class="bg-wrapper">
        <div id="bg-layer-1" class="bg-layer active-view"></div>
        <div id="bg-layer-2" class="bg-layer"></div>
    </div>

    <div class="player-dashboard">
        <h2 id="title">Select a Track to Play</h2>
        <audio id="audio-engine" controls preload="metadata"></audio>
        <ul id="list"></ul>
    </div>

    <script>
        const tracks = [
            { name: "1. Crimmels - Stealing All The Air [Official Audio]", url: "Crimmels - stealing all the air [official audio].mp3", img: "bg1.jpg", color: "#0f172a" }, 
            { name: "2. DIAF", url: "DIAF.mp3", img: "bg2.jpg", color: "#450a0a" }, 
            { name: "3. M.I.A. - [Official Diss Track]", url: "M.I.A. - [official diss track].mp3", img: "bg3.jpg", color: "#1e1b4b" }, 
            { name: "4. M.I.A. 2 (Official Diss Track)", url: "M.I.A. 2 (official diss track).mp3", img: "bg4.jpg", color: "#2e1065" }, 
            { name: "5. New Diss Lil Rupee", url: "new diss lil rupee.mp3", img: "bg5.jpg", color: "#022c22" }, 
            { name: "6. Scammer Boy - Disstrack", url: "scammer boy - disstrack.mp3", img: "bg6.jpg", color: "#431407" }, 
            { name: "7. Special Mentioned (Audio Track 1)", url: "special mentioned (audio track1).mp3", img: "bg7.jpg", color: "#0f172a" }, 
            { name: "8. Youngnelly - All Around Diss [Audio]", url: "youngnelly - all around diss [audio].mp3", img: "bg8.jpg", color: "#3b0764" }, 
            { name: "9. Youngnelly ft. BBD (Official Diss)", url: "youngnelly ft. BBD (official diss).mp3", img: "bg9.jpg", color: "#042f2e" }
        ];

        let currentTrackIndex = 0;
        let activeLayerToggle = 1; // Flips between 1 and 2 to crossfade layer assets smoothly

        const audioEngine = document.getElementById('audio-engine');
        const songTitle = document.getElementById('title');
        const playlistUI = document.getElementById('list');
        
        const bgMaster = document.getElementById('bg-master');
        const layer1 = document.getElementById('bg-layer-1');
        const layer2 = document.getElementById('bg-layer-2');

        function loadSong(index) {
            currentTrackIndex = index;
            audioEngine.src = tracks[index].url;
            audioEngine.load(); 
            songTitle.textContent = tracks[index].name;

            // NEW: The Dual-Layer Transition Crossfade Logic Engine
            const currentActiveLayer = (activeLayerToggle === 1) ? layer1 : layer2;
            const nextActiveLayer = (activeLayerToggle === 1) ? layer2 : layer1;

            // 1. Queue up the next graphic image layout, set it at the transparent bottom floor entry line
            nextActiveLayer.src = ""; // Clear file target node
            nextActiveLayer.style.backgroundImage = `url('${tracks[index].img}')`;
            nextActiveLayer.className = "bg-layer incoming-view"; 

            // 2. Trigger a tiny 20ms browser rendering timeout window to force structural execution smoothly
            setTimeout(() => {
                // Shift ambient color floor vibe
                bgMaster.style.backgroundColor = tracks[index].color;
                
                // Elevate and fade in the incoming plate node
                nextActiveLayer.className = "bg-layer active-view";
                
                // Fade away the old plate background node cleanly behind it
                currentActiveLayer.className = "bg-layer";
                
                // Flip the binary switch variable state handler
                activeLayerToggle = (activeLayerToggle === 1) ? 2 : 1;
            }, 20);

            playlistUI.innerHTML = "";
            tracks.forEach((track, i) => {
                const item = document.createElement('li');
                item.textContent = track.name;
                
                if (i === currentTrackIndex) {
                    item.classList.add('active-song');
                }
                
                item.onclick = () => { 
                    loadSong(i); 
                    setTimeout(() => {
                        audioEngine.play().catch(err => console.log("Stream engaged.", err));
                    }, 50);
                };
                playlistUI.appendChild(item);
            });
        }

        audioEngine.onended = () => {
            currentTrackIndex++;
            if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;
            loadSong(currentTrackIndex);
            setTimeout(() => { audioEngine.play(); }, 50);
        };
        
        loadSong(currentTrackIndex);
    </script>
</body>
</html>
