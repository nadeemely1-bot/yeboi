<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">
        <h2 id="title">Loading...</h2>
        <audio id="audio" src=""></audio>

        <div class="buttons">
            <button id="prev">⏮ Back</button>
            <button id="play">▶ Play</button>
            <button id="next">⏭ Next</button>
        </div>
        
        <ul id="list"></ul>
    </div>

    <script>
        // PASTE YOUR LINKS FROM AUDIO.COM HERE
        const tracks = [
            { name: "Song One", url: "https://audio.com/nadeemely1/audio/diaf" },
            { name: "Song Two", url: "https://audio.com/nadeemely1/audio/crimmels-stealing-all-the-air-official-audio" }
        ];

        let current = 0;
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const title = document.getElementById('title');
        const list = document.getElementById('list');

        function setupTrack(index) {
            current = index;
            audio.src = tracks[index].url;
            title.textContent = tracks[index].name;
            
            // Rebuild the song list highlights
            list.innerHTML = "";
            tracks.forEach((track, i) => {
                const item = document.createElement('li');
                item.textContent = track.name;
                if (i === current) item.style.color = "#1db954";
                item.onclick = () => { setupTrack(i); audio.play(); playBtn.textContent = "⏸ Pause"; };
                list.appendChild(item);
            });
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.textContent = "⏸ Pause"; }
            else { audio.pause(); playBtn.textContent = "▶ Play"; }
        };

        document.getElementById('next').onclick = () => {
            let next = current + 1;
            if (next >= tracks.length) next = 0;
            setupTrack(next); audio.play(); playBtn.textContent = "⏸ Pause";
        };

        document.getElementById('prev').onclick = () => {
            let prev = current - 1;
            if (prev < 0) prev = tracks.length - 1;
            setupTrack(prev); audio.play(); playBtn.textContent = "⏸ Pause";
        };

        audio.onended = () => { document.getElementById('next').click(); };
        setupTrack(current);
    </script>
</body>
</html>
