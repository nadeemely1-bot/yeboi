<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Crew Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-dashboard">
        <h2 id="title">Select a Track to Play</h2>
        
        <!-- Visible player dashboard engine mapping metadata preloads -->
        <audio id="audio-engine" controls preload="metadata"></audio>
        
        <ul id="list"></ul>
    </div>

    <script>
        // Mapped locally to match your exact uploaded GitHub file asset string locations
        const tracks = [
            { name: "1. Crimmels - Stealing All The Air [Official Audio]", url: "Crimmels - stealing all the air [official audio].mp3" },
            { name: "2. DIAF", url: "DIAF.mp3" },
            { name: "3. M.I.A. - [Official Diss Track]", url: "M.I.A. - [official diss track].mp3" },
            { name: "4. M.I.A. 2 (Official Diss Track)", url: "M.I.A. 2 (official diss track).mp3" },
            { name: "5. New Diss Lil Rupee", url: "new diss lil rupee.mp3" },
            { name: "6. Scammer Boy - Disstrack", url: "scammer boy - disstrack.mp3" },
            { name: "7. Special Mentioned (Audio Track 1)", url: "special mentioned (audio track1).mp3" },
            { name: "8. Youngnelly - All Around Diss [Audio]", url: "youngnelly - all around diss [audio].mp3" },
            { name: "9. Youngnelly ft. BBD (Official Diss)", url: "youngnelly ft. BBD (official diss).mp3" }
        ];

        let currentTrackIndex = 0;
        const audioEngine = document.getElementById('audio-engine');
        const songTitle = document.getElementById('title');
        const playlistUI = document.getElementById('list');

        function loadSong(index) {
            currentTrackIndex = index;
            // Uses localized system linking without external domains to bypass cross-origin browser freezes
            audioEngine.src = tracks[index].url;
            audioEngine.load(); 
            songTitle.textContent = tracks[index].name;

            // Rebuild selection highlighting markers
            playlistUI.innerHTML = "";
            tracks.forEach((track, i) => {
                const item = document.createElement('li');
                item.textContent = track.name;
                
                if (i === currentTrackIndex) {
                    item.classList.add('active-song');
                }
                
                item.onclick = () => { 
                    loadSong(i); 
                    // Safely triggers the browser audio node after connection pathways clear
                    setTimeout(() => {
                        audioEngine.play().catch(err => console.log("System initialized.", err));
                    }, 50);
                };
                playlistUI.appendChild(item);
            });
        }

        // Automatic consecutive track sequencing loop
        audioEngine.onended = () => {
            currentTrackIndex++;
            if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;
            loadSong(currentTrackIndex);
            setTimeout(() => { audioEngine.play(); }, 50);
        };
        
        loadSong(currentTrackIndex);
    </script>
</body>
</html>
